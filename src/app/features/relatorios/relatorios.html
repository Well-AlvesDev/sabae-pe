<header class="top-app-bar" role="banner" aria-label="Barra superior">
    <div class="leading">
        <button class="icon-button menu-button" aria-label="Abrir menu" type="button" (click)="toggleMenu()">
            <span class="material-icons">menu</span>
        </button>
        <div class="brand" aria-label="Logo da SABAE">
            <img src="/sabae-max.webp" alt="SABAE logo" class="app-bar-logo">
        </div>
    </div>

    <div class="actions">
        <div class="profile-avatar" [class.loading]="isLoadingProfile" aria-label="Perfil do usuário">
            <span *ngIf="!isLoadingProfile">{{ avatarInitial }}</span>
            <mat-progress-spinner *ngIf="isLoadingProfile" diameter="28" strokeWidth="3" mode="indeterminate"
                aria-hidden="true"></mat-progress-spinner>
        </div>
        <button class="icon-button" aria-label="Notificações" type="button">
            <span class="material-icons">notifications</span>
        </button>
    </div>
</header>

<div class="drawer-backdrop" *ngIf="isMenuOpen" (click)="closeMenu()" aria-hidden="true"></div>
<nav class="side-drawer" [class.open]="isMenuOpen" aria-label="Menu lateral">
    <div class="drawer-header">
        <div class="drawer-overlay"></div>
        <div class="drawer-profile">
            <div class="drawer-avatar" [class.loading]="isLoadingProfile"
                [attr.aria-label]="isLoadingProfile ? 'Carregando perfil do usuário' : 'Perfil do usuário'">
                <span *ngIf="!isLoadingProfile">{{ avatarInitial }}</span>
                <mat-progress-spinner *ngIf="isLoadingProfile" diameter="48" strokeWidth="3" mode="indeterminate"
                    aria-hidden="true"></mat-progress-spinner>
            </div>
            <div class="drawer-text">
                <div class="drawer-title">NOME DA ESCOLA</div>
                <div class="drawer-subtitle">{{ userEmail }}</div>
            </div>
        </div>
    </div>
    <div class="drawer-items">
        <a class="drawer-item" href="#"><span class="material-icons">settings</span>Configurações</a>
        <a class="drawer-item" href="#"><span class="material-icons">support_agent</span>Suporte</a>
        <a class="drawer-item" href="#"><span class="material-icons">security</span>Segurança</a>
        <button class="drawer-item logout-button" type="button" (click)="logout()">
            <span class="material-icons">exit_to_app</span>
            Sair
        </button>
    </div>
</nav>

<main class="relatorios-content">
    <section class="relatorios-panel" aria-label="Ações de relatórios">
        <label class="month-field" for="report-month">
            <span>Mês do relatório</span>
            <select id="report-month" [value]="selectedMonth" (change)="onMonthChange($event)">
                <option value="" disabled>Selecione o mês</option>
                <option *ngFor="let month of reportMonths" [value]="month.value">{{ month.label }}</option>
            </select>
        </label>
        <button class="primary-button" type="button" (click)="enviar()" [disabled]="isSyncingReport || !selectedMonth">
            <mat-progress-spinner *ngIf="isSyncingReport" diameter="20" strokeWidth="3" mode="indeterminate"
                aria-hidden="true"></mat-progress-spinner>
            <span>{{ isSyncingReport ? 'atualizando...' : 'enviar' }}</span>
        </button>
        <p class="report-status" aria-live="polite" *ngIf="reportStatus">{{ reportStatus }}</p>
    </section>
</main>

<nav class="bottom-nav" role="navigation" aria-label="Barra de navegação">
    <a routerLink="/home" class="nav-item" aria-label="Início">
        <span class="material-icons">home</span><span class="label">Início</span>
    </a>
    <a routerLink="/chamada" class="nav-item" aria-label="Chamada">
        <span class="material-icons">assignment</span><span class="label">Chamada</span>
    </a>
    <a routerLink="/relatorios" class="nav-item active" aria-label="Relatórios">
        <span class="material-icons">bar_chart</span><span class="label">Relatórios</span>
    </a>
    <a class="nav-item" href="#" aria-label="Alunos">
        <span class="material-icons">people</span><span class="label">Alunos</span>
    </a>
    <a class="nav-item" href="#" aria-label="Perfil">
        <span class="material-icons">account_circle</span><span class="label">Perfil</span>
    </a>
</nav>
