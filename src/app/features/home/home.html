<header class="top-app-bar" role="banner" aria-label="Barra superior">
  <div class="leading">
    <button class="icon-button menu-button" aria-label="Abrir menu">
      <span class="material-icons">menu</span>
    </button>
    <div class="brand" aria-label="Logo da SABAE">
      <img src="/sabae-max.png" alt="SABAE logo" class="app-bar-logo">
    </div>
  </div>
  <div class="actions">
    <div class="profile-avatar" [class.loading]="isLoadingProfile" aria-label="Perfil do usuário">
      <span *ngIf="!isLoadingProfile">{{ avatarInitial }}</span>
      <span *ngIf="isLoadingProfile" class="avatar-spinner" aria-hidden="true"></span>
    </div>
    <button class="icon-button" aria-label="Notificações">
      <span class="material-icons">notifications</span>
    </button>
  </div>
</header>


<div class="home-content">
  <div class="dashboard-shell">
    <div class="overview-title-row" aria-label="Visão Geral da Escola">
      <h2>Visão Geral da Escola</h2>
    </div>

    <section class="overview-card" aria-label="Visão Geral da Escola">
      <div class="overview-body">
        <div class="overview-left">
          <div class="card-title">
            <span class="material-icons">military_tech</span>
            <strong>Avaliação de frequência</strong>
          </div>
          <div class="score-row">
            <div class="score-label">Média Geral:</div>
            <div class="score-value">{{ averageScore }}/10</div>
          </div>
          <div class="performance-badge" [attr.aria-label]="performanceLabel">
            <span class="material-icons">check_circle</span>
            <span class="badge-text">{{ performanceLabel }}</span>
          </div>
        </div>

        <div class="overview-right" aria-hidden="false">
          <svg class="score-ring" viewBox="0 0 42 42" role="img" aria-label="Média {{ averageScore }} de 10">
            <circle class="ring-bg" cx="21" cy="21" r="15.5" />
            <circle class="ring" cx="21" cy="21" r="15.5" [attr.stroke-dasharray]="calcDashArray(averageScore)" />
            <text x="21" y="22" class="ring-text" text-anchor="middle">{{ averageScore }}</text>
            <text x="21" y="30" class="ring-subtext" text-anchor="middle">/10</text>
          </svg>
        </div>
      </div>
    </section>
  </div>
</div>

<nav class="bottom-nav" role="navigation" aria-label="Barra de navegação">
  <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item"
    aria-current="page">
    <span class="material-icons">home</span>
    <span class="label">Início</span>
  </a>
  <a class="nav-item" href="#" aria-label="Chamada">
    <span class="material-icons">assignment</span>
    <span class="label">Chamada</span>
  </a>
  <a class="nav-item" href="#" aria-label="Relatórios">
    <span class="material-icons">bar_chart</span>
    <span class="label">Relatórios</span>
  </a>
  <a class="nav-item" href="#" aria-label="Alunos">
    <span class="material-icons">people</span>
    <span class="label">Alunos</span>
  </a>
  <a class="nav-item" href="#" aria-label="Perfil">
    <span class="material-icons">account_circle</span>
    <span class="label">Perfil</span>
  </a>
</nav>
