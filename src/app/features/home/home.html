<header class="top-app-bar" role="banner" aria-label="Barra superior">
  <div class="leading">
    <span class="material-icons app-icon">menu</span>
  </div>
  <div class="title">Olá, {{ userName }}!</div>
  <div class="actions">
    <button class="icon-button" (click)="logout()" aria-label="Logout">
      <span class="material-icons">logout</span>
    </button>
  </div>
</header>

<div class="logo-container" role="img" aria-label="SABAE logo">
  <img src="/sabae-max.png" alt="SABAE logo" class="app-logo">
</div>

<div class="home-content">
  <div class="dashboard-shell">
    <!-- Conteúdo principal (card de boas-vindas removido) -->
  </div>
</div>

<nav class="bottom-nav" role="navigation" aria-label="Barra de navegação">
  <a routerLink="/home" routerLinkActive="active" class="nav-item" aria-current="page">
    <span class="material-icons">home</span>
    <span class="label">Home</span>
  </a>
  <a routerLink="/entities" routerLinkActive="active" class="nav-item">
    <span class="material-icons">layers</span>
    <span class="label">Entities</span>
  </a>
  <a routerLink="/account" routerLinkActive="active" class="nav-item">
    <span class="material-icons">send</span>
    <span class="label">Account</span>
  </a>
</nav>
