<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imagens do SABAE | Sistema de Apoio à Busca Ativa Escolar</title>
    <meta name="description"
        content="Imagens demonstrativas do SABAE, sistema de apoio à busca ativa escolar e ao acompanhamento da frequência dos alunos.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://sabae.com.br/imagens.html">
    <link rel="icon" type="image/png" href="/favicon.ico">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SABAE">
    <meta property="og:title" content="Imagens do SABAE">
    <meta property="og:description"
        content="Conheça o SABAE por meio de imagens da plataforma de acompanhamento escolar.">
    <meta property="og:url" content="https://sabae.com.br/imagens.html">
    <meta property="og:image" content="https://sabae.com.br/demonstrativo1.png">
    <meta property="og:image:alt" content="Tela demonstrativa do sistema SABAE">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ImageGallery",
      "name": "Imagens do SABAE",
      "description": "Galeria de imagens demonstrativas do Sistema de Apoio à Busca Ativa Escolar.",
      "url": "https://sabae.com.br/imagens.html",
      "image": [
        "https://sabae.com.br/demonstrativo1.png",
        "https://sabae.com.br/demonstrativo2.png"
      ]
    }
  </script>
    <style>
        :root {
            color-scheme: light;
            --ink: #16324f;
            --muted: #5d7183;
            --line: #d8e3ea;
            --paper: #f5f8fa;
            --accent: #0d7c86;
            --accent-dark: #075a63;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: Georgia, 'Times New Roman', serif;
        }

        .site-header {
            border-bottom: 1px solid var(--line);
            background: #fff;
        }

        .header-inner,
        .gallery-shell {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            min-height: 76px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            color: var(--ink);
            font-family: Arial, sans-serif;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-decoration: none;
            text-transform: uppercase;
        }

        .brand img {
            width: 132px;
            height: auto;
        }

        .back-link {
            color: var(--accent-dark);
            font-family: Arial, sans-serif;
            font-size: .85rem;
            font-weight: 700;
            text-decoration: none;
        }

        .gallery-shell {
            padding: 72px 0 88px;
        }

        .intro {
            max-width: 700px;
            margin-bottom: 46px;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--accent);
            font-family: Arial, sans-serif;
            font-size: .73rem;
            font-weight: 700;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.6rem, 6vw, 5.4rem);
            font-weight: 400;
            letter-spacing: -.035em;
            line-height: .95;
        }

        .intro p:last-child {
            max-width: 600px;
            margin: 24px 0 0;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 1.05rem;
            line-height: 1.65;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 28px;
        }

        figure {
            margin: 0;
            padding: 12px 12px 20px;
            border: 1px solid var(--line);
            background: #fff;
            box-shadow: 0 18px 40px rgba(22, 50, 79, .08);
        }

        figure img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            object-position: top;
            background: #eaf0f3;
        }

        figcaption {
            padding: 18px 8px 0;
            font-family: Arial, sans-serif;
            font-size: .92rem;
            line-height: 1.5;
        }

        figcaption strong {
            display: block;
            margin-bottom: 4px;
            color: var(--ink);
            font-size: 1rem;
        }

        figcaption span {
            color: var(--muted);
        }

        .site-footer {
            padding: 24px 20px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            background: #fff;
            font-family: Arial, sans-serif;
            font-size: .78rem;
            text-align: center;
        }

        @media (max-width: 700px) {

            .header-inner,
            .gallery-shell {
                width: min(100% - 28px, 1120px);
            }

            .header-inner {
                min-height: 66px;
            }

            .brand img {
                width: 112px;
            }

            .back-link {
                font-size: .76rem;
            }

            .gallery-shell {
                padding: 52px 0 64px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 22px;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/" aria-label="SABAE - página inicial">
                <img src="/sabae-max2.webp" alt="SABAE">
            </a>
            <a class="back-link" href="/">/ Imagens SABAE</a>
        </div>
    </header>

    <main class="gallery-shell">
        <section class="intro" aria-labelledby="gallery-title">
            <p class="eyebrow">Sistema de apoio à busca ativa escolar</p>
            <h1 id="gallery-title">Imagens do SABAE</h1>
            <p>Uma visão do ambiente criado para apoiar o acompanhamento de alunos, turmas e frequência escolar em um só
                lugar.</p>
        </section>

        <section class="gallery" aria-label="Galeria de imagens demonstrativas">
            <figure>
                <img src="/demonstrativo1.png"
                    alt="Painel do SABAE com visão geral da escola e indicadores de frequência" width="1280"
                    height="800" loading="eager" fetchpriority="high">
                <figcaption>
                    <strong>Tela de login</strong>
                    <span>Interface de acesso ao sistema do SABAE.</span>
                </figcaption>
            </figure>
            <figure>
                <img src="/demonstrativo2.png" alt="Tela do SABAE para registro e acompanhamento da chamada escolar"
                    width="1280" height="800" loading="lazy">
                <figcaption>
                    <strong>Tela home</strong>
                    <span>Interface principal do sistema do SABAE.</span>
                </figcaption>
            </figure>
        </section>
    </main>

    <footer class="site-footer">
        SABAE - Sistema de Apoio à Busca Ativa Escolar
    </footer>
</body>

</html>
